name: Cost attachment extraction
on:
  push:
    paths:
      - '.github/workflows/cost_attachment_extract.yml'
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install safe readers
        run: |
          python -m pip install --quiet openpyxl xlrd python-pptx pypdf
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr
      - name: Extract text and formulas without executing macros
        run: |
          python - <<'PY'
          import os, json, zipfile
          from pathlib import Path
          out=Path("cost_attachment_extract"); out.mkdir(exist_ok=True)
          att=Path("attachments")
          # OOXML spreadsheets: formulas/text only, never VBA execution.
          import openpyxl
          for fn in ["CAPCOST_2017_rev2.xlsm","CCEP-Version 1-Read this first.xlsx","DFP-Version 1 (Feb 2011).xlsm"]:
              p=att/fn
              wb=openpyxl.load_workbook(p, read_only=True, data_only=False, keep_vba=False)
              with open(out/(fn+".txt"),"w",encoding="utf-8") as w:
                  for ws in wb.worksheets:
                      w.write(f"\n=== SHEET: {ws.title} ===\n")
                      for row in ws.iter_rows():
                          vals=[]
                          for c in row:
                              if c.value not in (None,""):
                                  vals.append(f"{c.coordinate}={c.value}")
                          if vals: w.write(" | ".join(vals)+"\n")
          # Legacy XLS.
          import xlrd
          fn="CCEP-Version 1-Use this next.xls"
          try:
              book=xlrd.open_workbook(att/fn, formatting_info=False)
              with open(out/(fn+".txt"),"w",encoding="utf-8") as w:
                  for sh in book.sheets():
                      w.write(f"\n=== SHEET: {sh.name} ===\n")
                      for r in range(sh.nrows):
                          vals=[f"R{r+1}C{c+1}={sh.cell_value(r,c)}" for c in range(sh.ncols) if sh.cell_value(r,c) not in ("",None)]
                          if vals: w.write(" | ".join(vals)+"\n")
          except Exception as e:
              with open(out/(fn+".txt"),"w",encoding="utf-8") as w:
                  w.write("UNREADABLE WITHOUT PASSWORD/DECRYPTION: "+repr(e)+"\n")
          # PPTX text.
          from pptx import Presentation
          fn="CN4119-0-Second Part Intro.pptx"; prs=Presentation(att/fn)
          with open(out/(fn+".txt"),"w",encoding="utf-8") as w:
              for i,sl in enumerate(prs.slides,1):
                  w.write(f"\n=== SLIDE {i} ===\n")
                  for shape in sl.shapes:
                      if hasattr(shape,"text") and shape.text.strip(): w.write(shape.text.strip()+"\n")
          # PDFs: embedded text only; no OCR/macro execution.
          from pypdf import PdfReader
          for fn in ["CN4119-1-Cost Estimation and Economic Analysis-Intro.pdf","CN4119-2-Capital Cost Estimation.pdf","CN4119-3-Capital Cost Estimation-Scanned Appendix.pdf","CN4119-4-Manufacturing Cost Estimation.pdf","CN4119-5-Engineering Economic Analysis.pdf","Evaluating Capital Cost Estimation Programs.PDF"]:
              reader=PdfReader(att/fn)
              with open(out/(fn+".txt"),"w",encoding="utf-8") as w:
                  w.write(f"PAGES={len(reader.pages)}\n")
                  for i,page in enumerate(reader.pages,1):
                      w.write(f"\n=== PAGE {i} ===\n")
                      w.write((page.extract_text() or "[NO EMBEDDED TEXT]")+"\n")
          PY
      - name: OCR scanned evaluation article
        run: |
          mkdir -p /tmp/evalpages
          pdftoppm -r 180 -png "attachments/Evaluating Capital Cost Estimation Programs.PDF" /tmp/evalpages/p >/dev/null 2>&1
          : > "cost_attachment_extract/Evaluating Capital Cost Estimation Programs.PDF.ocr.txt"
          for img in /tmp/evalpages/*.png; do
            echo "=== $img ===" >> "cost_attachment_extract/Evaluating Capital Cost Estimation Programs.PDF.ocr.txt"
            tesseract "$img" stdout 2>/dev/null >> "cost_attachment_extract/Evaluating Capital Cost Estimation Programs.PDF.ocr.txt"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cost-attachment-extract
          path: cost_attachment_extract/

# safe extraction retry
