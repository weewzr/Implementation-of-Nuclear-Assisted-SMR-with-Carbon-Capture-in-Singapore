name: Paper and reproducibility

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Set up cached TeX Live 2023
        uses: zauguin/install-texlive@f5e7d0b117035fff797d4392ea94131747e03d60
        with:
          texlive_version: 2023
          packages: >
            latex
            latex-bin
            bibtex
            latexmk
            geometry
            amsmath
            amsfonts
            booktabs
            tools
            siunitx
            graphics
            epstopdf-pkg
            xcolor
            xurl
            hyperref
            pdftexcmds
            infwarerr
            ltxcmds
            kvsetkeys
            kvdefinekeys
            kvoptions
            pdfescape
            etoolbox
            auxhook
            atbegshi
            atveryend
            rerunfilecheck
            uniquecounter
            hycolor
            refcount
            gettitlestring
            stringenc
            intcalc
            bigintcalc
            bitset
            iftex
            natbib
            microtype
            pgf
            pgfplots
      - name: Reproduce and build manuscript
        run: sh paper/build.sh
      - name: Upload generated manuscript
        uses: actions/upload-artifact@v4
        with:
          name: cn4252-manuscript
          path: paper/main.pdf
