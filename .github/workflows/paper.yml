name: Paper and reproducibility

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install LaTeX
        run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-extra texlive-science
      - name: Reproduce and build manuscript
        run: sh paper/build.sh
      - name: Upload generated manuscript
        uses: actions/upload-artifact@v4
        with:
          name: cn4252-manuscript
          path: paper/main.pdf
